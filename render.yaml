services:
  - type: web
    name: aero-engine-digital-twin
    runtime: docker
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEMO_OPERATOR_USERNAME
        value: operator
      - key: DEMO_OPERATOR_PASSWORD
        sync: false
      - key: DEMO_ENGINEER_USERNAME
        value: engineer
      - key: DEMO_ENGINEER_PASSWORD
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: DB_PATH
        value: /app/data/telemetry_db.sqlite
